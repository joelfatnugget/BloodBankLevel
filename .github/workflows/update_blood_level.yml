name: Update Blood Levels Card

on:
  schedule:
    # Run at 00:17 UTC (~08:17 SGT) to avoid midnight UTC runner contention
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-blood-levels
  cancel-in-progress: false

jobs:
  update-blood-levels:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run tests
      run: |
        pytest tests/

    - name: Run Python script
      run: |
        python fetch_blood.py

    - name: Commit and push changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add README.md
        if ! git diff --staged --quiet; then
          git commit -m "Update blood levels card in README.md"
          git pull --rebase && git push
        else
          echo "No changes in blood levels detected."
        fi
